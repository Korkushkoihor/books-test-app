<div class="mat-shadow-2 table-container">
  <div class="table-wrapper">
    <app-books-filter 
      [selectedBooks]="selectedBooks()"
      (deleteSelectedBooksChange)="deleteSelectedBooks()"
      (openAddBookDialogChange)="openAddBookDialog()"
      (searchValueChange)="onSearchChange($event)"
      (importXmlChange)="importBooksFromXml($event)"
      (exportXmlChange)="exportSelectedBooks()"
      (openAddBookDialog)="openAddBookDialog()">
    </app-books-filter>

    <table 
      class="table" 
      [dataSource]="dataSource" 
      mat-table 
      matSort 
      (matSortChange)="onSortChange($event)"  
    >
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          @if (dataSource.data.length > 0) {
            <mat-checkbox (change)="$event ? toggleAllRows() : null"
                          [checked]="selection.hasValue() && isAllSelected()"
                          [indeterminate]="isSomeSelected()">
            </mat-checkbox>
          }
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.id}} </td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
        <td mat-cell *matCellDef="let row"> {{row.title}} </td>
      </ng-container>

      <ng-container matColumnDef="pages">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Pages </th>
        <td mat-cell *matCellDef="let row"> {{row.pages}} </td>
      </ng-container>
      
      <ng-container matColumnDef="author">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Author </th>
        <td mat-cell *matCellDef="let row"> {{row.author}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="editBook(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteBook(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</div>
